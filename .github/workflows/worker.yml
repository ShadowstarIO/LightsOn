name: Deploy LightsOn worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Apply D1 schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: db80b407c9444b69c5bc38bbe07efb38
          workingDirectory: worker
          command: d1 execute lightson --remote --file=schema.sql

      - name: Deploy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: db80b407c9444b69c5bc38bbe07efb38
          workingDirectory: worker
          command: deploy
          secrets: |
            INGEST_KEY
        env:
          INGEST_KEY: ${{ secrets.LIGHTSON_INGEST_KEY }}
